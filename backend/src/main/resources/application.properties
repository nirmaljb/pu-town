spring.application.name=pu-go

# The Published Avatar Collection the authoring tool writes. Rooms resolve it at creation,
# so republishing reaches the next Room without a rebuild or a restart.
putown.avatars.publication=data/published-avatars.json

# Browser origins allowed to open /ws/game and fetch a Room's collection: any host on the
# frontend's port, so the other computers on the network can play, and a link shared
# through a Cloudflare quick tunnel (`python run.py --share`).
putown.allowed-origins=http://*:5173,https://*:5173,https://*.trycloudflare.com
